<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Reminder System - Dark Theme Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
</head>
<body class="bg-gray-900 text-gray-100">
    <div class="min-h-screen">
        <!-- Header -->
        <div class="bg-gray-800 shadow">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center py-6">
                    <h1 class="text-3xl font-bold text-white">Payment Reminder System</h1>
                    <div class="flex space-x-4">
                        <!-- Dark Mode Toggle -->
                        <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-gray-700 hover:bg-gray-600 transition-colors">
                            <svg class="w-5 h-5 text-yellow-500" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707a1 1 0 011.414 0zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd" />
                            </svg>
                        </button>
                        <button class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md">
                            Spreadsheet View
                        </button>
                        <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md">
                            Dashboard
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Summary Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-gray-800 overflow-hidden shadow rounded-lg">
                    <div class="p-5">
                        <div class="flex items-center">
                            <div class="flex-shrink-0">
                                <div class="w-8 h-8 bg-blue-500 rounded-md flex items-center justify-center">
                                    <span class="text-white text-sm font-medium">C</span>
                                </div>
                            </div>
                            <div class="ml-5 w-0 flex-1">
                                <dl>
                                    <dt class="text-sm font-medium text-gray-400 truncate">Total Clients</dt>
                                    <dd class="text-lg font-medium text-white">24</dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-gray-800 overflow-hidden shadow rounded-lg">
                    <div class="p-5">
                        <div class="flex items-center">
                            <div class="flex-shrink-0">
                                <div class="w-8 h-8 bg-green-500 rounded-md flex items-center justify-center">
                                    <span class="text-white text-sm font-medium">P</span>
                                </div>
                            </div>
                            <div class="ml-5 w-0 flex-1">
                                <dl>
                                    <dt class="text-sm font-medium text-gray-400 truncate">Paid Installments</dt>
                                    <dd class="text-lg font-medium text-white">18</dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-gray-800 overflow-hidden shadow rounded-lg">
                    <div class="p-5">
                        <div class="flex items-center">
                            <div class="flex-shrink-0">
                                <div class="w-8 h-8 bg-red-500 rounded-md flex items-center justify-center">
                                    <span class="text-white text-sm font-medium">!</span>
                                </div>
                            </div>
                            <div class="ml-5 w-0 flex-1">
                                <dl>
                                    <dt class="text-sm font-medium text-gray-400 truncate">Overdue Installments</dt>
                                    <dd class="text-lg font-medium text-white">6</dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Spreadsheet Table -->
            <div class="bg-gray-800 shadow rounded-lg">
                <div class="px-4 py-5 sm:p-6">
                    <div class="mb-4 flex justify-between items-center">
                        <h2 class="text-lg font-medium text-white">Customer Information</h2>
                        <button class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md">
                            Add New Row
                        </button>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="min-w-full border-collapse border border-gray-600">
                            <thead>
                                <tr class="bg-gray-700">
                                    <th class="border border-gray-600 px-4 py-2 text-left text-sm font-medium text-white">
                                        First Name
                                    </th>
                                    <th class="border border-gray-600 px-4 py-2 text-left text-sm font-medium text-white">
                                        Last Name
                                    </th>
                                    <th class="border border-gray-600 px-4 py-2 text-left text-sm font-medium text-white">
                                        Email Address
                                    </th>
                                    <th class="border border-gray-600 px-4 py-2 text-left text-sm font-medium text-white">
                                        Reminder Date
                                    </th>
                                    <th class="border border-gray-600 px-4 py-2 text-left text-sm font-medium text-white">
                                        Due Date
                                    </th>
                                    <th class="border border-gray-600 px-4 py-2 text-left text-sm font-medium text-white">
                                        Paid
                                    </th>
                                    <th class="border border-gray-600 px-4 py-2 text-left text-sm font-medium text-white">
                                        Actions
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="hover:bg-gray-700">
                                    <td class="border border-gray-600 px-4 py-2 cursor-pointer hover:bg-gray-600 text-gray-100">
                                        John
                                    </td>
                                    <td class="border border-gray-600 px-4 py-2 cursor-pointer hover:bg-gray-600 text-gray-100">
                                        Doe
                                    </td>
                                    <td class="border border-gray-600 px-4 py-2 cursor-pointer hover:bg-gray-600 text-gray-100">
                                        john.doe@email.com
                                    </td>
                                    <td class="border border-gray-600 px-4 py-2 cursor-pointer hover:bg-gray-600 text-gray-100">
                                        2024-01-15
                                    </td>
                                    <td class="border border-gray-600 px-4 py-2 cursor-pointer hover:bg-gray-600 text-gray-100">
                                        2024-01-31
                                    </td>
                                    <td class="border border-gray-600 px-4 py-2 cursor-pointer text-center">
                                        <span class="px-2 py-1 rounded-full text-xs font-semibold bg-red-800 text-red-100">
                                            No
                                        </span>
                                    </td>
                                    <td class="border border-gray-600 px-4 py-2 text-center">
                                        <button class="text-red-400 hover:text-red-300 text-sm">
                                            Delete
                                        </button>
                                    </td>
                                </tr>
                                <tr class="hover:bg-gray-700">
                                    <td class="border border-gray-600 px-4 py-2 cursor-pointer hover:bg-gray-600 text-gray-100">
                                        Jane
                                    </td>
                                    <td class="border border-gray-600 px-4 py-2 cursor-pointer hover:bg-gray-600 text-gray-100">
                                        Smith
                                    </td>
                                    <td class="border border-gray-600 px-4 py-2 cursor-pointer hover:bg-gray-600 text-gray-100">
                                        jane.smith@email.com
                                    </td>
                                    <td class="border border-gray-600 px-4 py-2 cursor-pointer hover:bg-gray-600 text-gray-100">
                                        2024-01-10
                                    </td>
                                    <td class="border border-gray-600 px-4 py-2 cursor-pointer hover:bg-gray-600 text-gray-100">
                                        2024-01-25
                                    </td>
                                    <td class="border border-gray-600 px-4 py-2 cursor-pointer text-center">
                                        <span class="px-2 py-1 rounded-full text-xs font-semibold bg-green-800 text-green-100">
                                            Yes
                                        </span>
                                    </td>
                                    <td class="border border-gray-600 px-4 py-2 text-center">
                                        <button class="text-red-400 hover:text-red-300 text-sm">
                                            Delete
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleDarkMode() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');
            
            if (isDark) {
                html.classList.remove('dark');
                html.classList.add('light');
                document.body.className = 'bg-gray-50 text-gray-900';
                updateElementsForLightMode();
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                document.body.className = 'bg-gray-900 text-gray-100';
                updateElementsForDarkMode();
            }
        }

        function updateElementsForDarkMode() {
            document.querySelector('h1').className = 'text-3xl font-bold text-white';
            document.querySelectorAll('.bg-gray-800').forEach(el => {
                el.classList.remove('bg-gray-800');
                el.classList.add('bg-gray-800');
            });
        }

        function updateElementsForLightMode() {
            document.querySelector('h1').className = 'text-3xl font-bold text-gray-900';
            document.querySelectorAll('.bg-gray-800').forEach(el => {
                el.classList.remove('bg-gray-800');
                el.classList.add('bg-white');
            });
        }
    </script>
</body>
</html>
